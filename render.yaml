# Render Blueprint: backend only. The frontend goes on Vercel (see README).
services:
  - type: web
    name: muskan-api
    runtime: node
    plan: free            # free tier sleeps after ~15 min idle and takes ~1 min to wake
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false        # e.g. https://muskan-birthday.vercel.app
